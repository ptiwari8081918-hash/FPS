services:
  - type: web
    name: annseva-fpsbooking
    env: node
    region: singapore   # Closest to India
    plan: free          # Free tier (or starter for 24/7 always-on)
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # Set in Render Dashboard
      - key: DEFAULT_PASSWORD
        value: jaihind
      - key: JWT_SECRET
        sync: false        # Set in Render Dashboard
      - key: PAYLOAD_ENCRYPTION_KEY
        value: annseva-fps-e2e-encryption-secret-key-32
      - key: UPPDS_API
        value: https://portal.uppds.in/api/PublicDashboard/DashboardTxnCumAuthReport/excel
      - key: UPPDS_MONTH
        value: "2026-01-01"
      - key: CORS_ORIGIN
        sync: false        # Optional
      - key: RAZORPAY_KEY_ID
        sync: false        # Set in Render Dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false        # Set in Render Dashboard
